[project]
name = "quantum-ray-tracing"
version = "0.1.0"
description = "Quantum ray tracing (Grover intersection search) and quantum ray marching (quantum walk + amplitude estimation) in Qiskit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "qiskit>=2.6.2",
    "qiskit-aer>=0.18.2",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
qrt-experiments = "quantum_ray_tracing.experiments:main"
qps-experiments = "quantum_ray_tracing.particle_experiments:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer Aer simulations"]
